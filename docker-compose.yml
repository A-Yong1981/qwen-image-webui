# ==========================================
# 專案說明：Qwen 生圖工作台
#   在瀏覽器裡輸入一句話，呼叫 Kaggle 免費 GPU（T4 x2）
#   跑 Qwen-Image-2.1 GGUF 輕量版生圖，圖跑完顯示在網頁上
# 維護日期：2026-11
# ==========================================
services:
  qwen-webui:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - ./data:/data
    environment:
      # 金鑰也可以在這裡填，但建議第一次打開網頁後去「設定」頁填，
      # 存在 /data/settings.json（權限 600），重建容器也不會丟。
      KAGGLE_USERNAME: ""
      KAGGLE_KEY: ""
    restart: unless-stopped
    mem_limit: 512m
